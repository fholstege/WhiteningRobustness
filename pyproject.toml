[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whitening-research"
version = "0.1.0"
description = "NumPy and scikit-learn experiments for whitening frozen representations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2,<4",
    "scipy>=1.11,<2",
    "scikit-learn>=1.9,<1.10",
    "threadpoolctl>=3,<4",
]

[project.optional-dependencies]
test = ["pytest>=7,<9"]
plot = ["matplotlib>=3.5,<4"]
embeddings = [
    "pillow>=10,<13",
    "torch>=2.6",
    "torchvision>=0.21",
    "tqdm>=4.66,<5",
    "transformers>=4.56,<5",
]

[tool.setuptools]
include-package-data = false
py-modules = [
    "aggregate",
    "comparison",
    "data",
    "evalaute_synthetic",
    "evaluate",
    "finetune_results",
    "frozen_results",
    "hyper_param_sweep",
    "metric",
    "methods",
    "model",
    "nonlinear_shrinkage",
    "style",
    "synthetic",
    "synthetic_sweep",
    "viz",
    "viz_comparison",
    "viz_direction",
    "viz_synthetic",
    "whitening",
    "whitening_core",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
